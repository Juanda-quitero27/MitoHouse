<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mito House · Menú</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0e1d18;--card:#173029;--card2:#1e3d34;--ink:#f6ecd9;--mute:#b9c7bd;--acc:#ff7a59;--acc2:#ffc46b;--line:#ffffff1f}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
.top{position:sticky;top:0;z-index:30;background:linear-gradient(90deg,var(--acc),var(--acc2));display:flex;padding-top:env(safe-area-inset-top,0px)}
.top a,.top button{flex:1;text-align:center;padding:12px 8px;color:#2b130b;font-weight:800;text-decoration:none;background:none;border:0;font:inherit;font-weight:800;cursor:pointer}
.top a+a,.top button+button,.top a+button{border-left:1px solid #0003}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 44px);z-index:20;background:#0e1d18ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--mute);padding:10px 16px;border-radius:99px;font:inherit;font-weight:700;cursor:pointer;transition:.3s}
.tabs button.on{background:var(--acc);color:#2b130b;transform:scale(1.06)}
.hero{position:relative;min-height:70vh;display:grid;place-items:center;text-align:center;padding:60px 20px;overflow:hidden;background:radial-gradient(circle at 30% 20%,#2a5a4a 0,transparent 55%),radial-gradient(circle at 80% 80%,#6b2f1d 0,transparent 50%),var(--bg)}
.hero h1{font-size:clamp(2.6rem,9vw,5.5rem);letter-spacing:2px;line-height:1}
.hero h1 span{color:var(--acc)}
.hero p{color:var(--mute);max-width:520px;margin:16px auto 28px;font-size:1.1rem}
.cta{display:inline-block;background:var(--acc);color:#2b130b;font-weight:800;padding:14px 30px;border-radius:99px;text-decoration:none;transition:.3s;box-shadow:0 8px 30px #ff7a5955}
.cta:hover{transform:translateY(-3px) scale(1.04)}
.float{position:absolute;font-size:clamp(2rem,7vw,4rem);opacity:.85;will-change:transform;animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{margin-top:-14px}}
main{max-width:860px;margin:0 auto;padding:10px 14px 80px}
section{padding-top:36px}
.sh{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.sh h2{font-size:clamp(1.8rem,5vw,2.6rem);color:var(--acc2)}
.sh i{flex:1;height:2px;background:linear-gradient(90deg,var(--acc),transparent)}
.note{color:var(--mute);text-align:center;font-weight:700;letter-spacing:.5px;margin:0 0 16px;font-size:.9rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);opacity:0;transform:translateY(50px) scale(.94);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.card.in{opacity:1;transform:none}
.card:hover{box-shadow:0 14px 40px #0008;transform:translateY(-6px)}
.pic{aspect-ratio:4/3;display:grid;place-items:center;font-size:4rem;overflow:hidden;position:relative}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .pic img,.card:hover .pic b{transform:scale(1.12) rotate(-3deg)}
.pic b{font-size:4.2rem;transition:transform .6s;filter:drop-shadow(0 6px 10px #0006)}
.info{padding:12px 12px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{font-size:1.1rem}
.info p{margin:0;color:var(--mute);font-size:.85rem;line-height:1.4;flex:1}
.price{color:var(--acc2);font-weight:800;font-size:1.1rem}
.del{align-self:center;background:#b3261e;color:#fff;border:0;border-radius:8px;padding:5px 12px;cursor:pointer;font:inherit;font-size:.8rem}
body.adm .new{outline:2px dashed var(--acc);outline-offset:-4px}
footer{text-align:center;padding:40px 16px 60px;color:var(--mute);border-top:1px solid var(--line)}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:50;padding:16px}
.modal.open{display:grid}
.box{background:var(--card2);border-radius:20px;padding:24px;width:100%;max-width:420px;max-height:90vh;overflow:auto;animation:pop .35s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.box h3{margin-bottom:14px;font-size:1.4rem;color:var(--acc2)}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0e1d18;color:var(--ink);font:inherit}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:12px;border-radius:10px;border:0;font:inherit;font-weight:800;cursor:pointer}
.ok{background:var(--acc);color:#2b130b}.no{background:#ffffff1a;color:var(--ink)}
.err{color:#ff9d8f;font-size:.85rem;min-height:1em;margin-top:8px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:50%;transform:translate(-50%,100px);background:var(--acc2);color:#2b130b;padding:12px 22px;border-radius:99px;font-weight:800;transition:.4s;z-index:60}
.toast.show{transform:translate(-50%,0)}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="top">
  <a href="#contacto">Contáctanos</a>
  <a href="#hamburguesas">Recomendados</a>
  <button id="btnAdmin">🔐 Admin</button>
</div>
<header class="hero">
  <span class="float" style="left:8%;top:18%" data-s=".25">🍝</span>
  <span class="float" style="right:10%;top:14%;animation-delay:-1s" data-s=".4">🍔</span>
  <span class="float" style="left:14%;bottom:12%;animation-delay:-2s" data-s=".15">🥗</span>
  <span class="float" style="right:12%;bottom:16%;animation-delay:-3s" data-s=".3">🍢</span>
  <div>
    <h1>MITO <span>HOUSE</span></h1>
    <p>Parrilla, pastas y sabor de casa. Explora nuestro menú y elige tu favorito.</p>
    <a class="cta" href="#pastas">Ver el menú</a>
  </div>
</header>
<nav class="tabs" id="tabs" aria-label="Categorías"></nav>
<main id="menu"></main>
<footer id="contacto">
  <h3 style="color:var(--acc2);margin-bottom:8px">Contáctanos</h3>
  <p>Escríbenos para reservas y pedidos.<br>📍 Tu dirección aquí · 📞 Tu teléfono aquí</p>
  <p>© Mito House Restaurante</p>
</footer>

<div class="modal" id="mLogin"><div class="box">
  <h3>Acceso administrador</h3>
  <label>Usuario</label><input id="u" autocomplete="username">
  <label>Contraseña</label><input id="p" type="password" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <div class="row"><button class="no" data-close>Cancelar</button><button class="ok" id="doLogin">Entrar</button></div>
</div></div>

<div class="modal" id="mAdd"><div class="box">
  <h3>Agregar platillo</h3>
  <label>Categoría</label><select id="aCat"></select>
  <label>Nombre</label><input id="aName" maxlength="50">
  <label>Descripción</label><textarea id="aDesc" rows="3" maxlength="200"></textarea>
  <label>Precio (COP)</label><input id="aPrice" type="number" min="0" step="500">
  <label>Emoji (si no subes foto)</label><input id="aEmoji" value="🍽️" maxlength="4">
  <label>Foto (opcional)</label><input id="aImg" type="file" accept="image/*">
  <div class="err" id="aerr"></div>
  <div class="row"><button class="no" data-close>Cerrar</button><button class="ok" id="doAdd">Agregar</button></div>
  <div class="row"><button class="no" id="doLogout">Cerrar sesión</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const CATS=[
{id:"pastas",n:"Pastas",note:"ELIGE TU PASTA: LINGUINI, ESPAGUETI O PENNE",d:[
["Pasta Mito House","La especialidad de la casa, con salsa cremosa y toque de parmesano.",55000,"🍝"],
["Pasta con Lomo Saltado","Pasta al dente con lomo de res saltado y vegetales.",43000,"🥩"],
["Pollo con Champiñón","Pollo tierno en salsa cremosa de champiñones.",41500,"🍄"],
["Pollo con Camarón","Pollo y camarones salteados en salsa de la casa.",43500,"🍤"],
["Carbonara","Clásica salsa carbonara con tocineta crocante.",40000,"🥓"]]},
{id:"brochetas",n:"Brochetas",note:"A LA PARRILLA, CON ACOMPAÑAMIENTOS",d:[
["Mariscos","Brocheta de mariscos asados al carbón.",36000,"🦐"],
["Chinchulla y Ubre","Tradicional, dorada y bien sazonada.",33500,"🍢"],
["Mixta","Combinación de carnes a la parrilla.",33500,"🍢"],
["Res","Cubos de res jugosos a la parrilla.",33500,"🥩"],
["Pollo","Pollo marinado asado al fuego.",33500,"🍗"]]},
{id:"ensaladas",n:"Ensaladas",note:"FRESCAS, CON VINAGRETA DE LA CASA",d:[
["Ensalada de Mariscos","Lechuga fresca, tomate, aguacate, naranja, mango, camarón, calamar, pulpo, mejillón, almeja y queso parmesano.",43500,"🦑"],
["Ensalada César","Lechuga fresca, aderezo honey mustard, crotones, pollo al grill, maíz dulce, tocineta crunch y parmesano.",36000,"🥗"],
["Ensalada Salmón","Lechuga, salmón, aguacate, hinojo, semillas de sésamo, maní, parmesano, crotones y alcaparras.",46000,"🐟"]]},
{id:"hamburguesas",n:"Hamburguesas",note:"CON PAPAS FRITAS",d:[
["Cucuteña","Croqueta de carne, pollo al grill, tocineta, chorizo, vegetales y papas fritas.",31500,"🍔"],
["La Llanera","Croqueta de res, brisket ahumado, chorizo, queso mozzarella, vegetales y papas fritas.",31500,"🍔"],
["Super House","Croqueta de carne, pollo y cerdo al grill, huevo frito, chorizo, brisket, aguacate, queso, vegetales y papas.",48000,"🍔"]]},
{id:"kids",n:"Kids",note:"PARA LOS MÁS PEQUEÑOS",d:[
["Mini Hamburguesa","Hamburguesa en tamaño pequeño.",15000,"🍔"],
["Mini Pincho","Pincho suave y delicioso.",15000,"🍢"],
["Mini Salchipapa","Salchicha con papas fritas.",15000,"🍟"]]}
];
const $=s=>document.querySelector(s);
const fmt=n=>"$"+Number(n).toLocaleString("es-CO");
let custom=[];let token="";
try{token=sessionStorage.getItem("mito_token")||""}catch(e){}
let admin=!!token;
async function api(m,url,body){const r=await fetch(url,{method:m,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(r.status===401&&token&&url!=="/api/login")logout();if(!r.ok)throw new Error(j.error||"Error");return j}
async function load(){try{custom=await api("GET","/api/dishes")}catch(e){}render()}
function logout(){token="";admin=false;try{sessionStorage.removeItem("mito_token")}catch(e){}render()}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2400)}
function card(d,cid,idx,isNew){
  const pic=d.img?`<img src="${d.img}" alt="${esc(d.n)}">`:`<b>${esc(d.e)}</b>`;
  const grad=`background:linear-gradient(${135+idx*25}deg,#2b5c4c,#7a3a22)`;
  return `<article class="card${isNew?" new":""}"><div class="pic" style="${grad}">${pic}</div><div class="info"><h3>${esc(d.n)}</h3><p>${esc(d.d)}</p><div class="price">${fmt(d.p)}</div>${isNew&&admin?`<button class="del" data-del="${d.id}">Eliminar</button>`:""}</div></article>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){
  $("#menu").innerHTML=CATS.map(c=>{
    const base=c.d.map((x,i)=>card({n:x[0],d:x[1],p:x[2],e:x[3]},c.id,i,false));
    const extra=custom.filter(x=>x.c===c.id).map((x,i)=>card(x,c.id,i+base.length,true));
    return `<section id="${c.id}"><div class="sh"><h2>${c.n}</h2><i></i></div><p class="note">${c.note}</p><div class="grid">${base.concat(extra).join("")}</div></section>`;
  }).join("");
  $("#tabs").innerHTML=CATS.map(c=>`<button data-t="${c.id}">${c.n}</button>`).join("");
  $("#aCat").innerHTML=CATS.map(c=>`<option value="${c.id}">${c.n}</option>`).join("");
  document.body.classList.toggle("adm",admin);$("#btnAdmin").textContent=admin?"➕ Agregar plato":"🔐 Admin";
  observe();
}
let io,so;
function observe(){
  io&&io.disconnect();so&&so.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const sib=[...e.target.parentNode.children].indexOf(e.target);e.target.style.transitionDelay=(sib%3)*90+"ms";e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
  document.querySelectorAll(".card").forEach(c=>io.observe(c));
  so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll(".tabs button").forEach(b=>{const on=b.dataset.t===e.target.id;b.classList.toggle("on",on);if(on)b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})})}}),{rootMargin:"-30% 0px -60% 0px"});
  document.querySelectorAll("main section").forEach(s=>so.observe(s));
}
$("#tabs").addEventListener("click",e=>{const t=e.target.dataset.t;if(t)document.getElementById(t).scrollIntoView({behavior:"smooth"})});
window.addEventListener("scroll",()=>{const y=scrollY;document.querySelectorAll(".float").forEach(f=>f.style.transform=`translateY(${y*f.dataset.s}px) rotate(${y*.06}deg)`)},{passive:true});
function open(id){$(id).classList.add("open")}
function closeAll(){document.querySelectorAll(".modal").forEach(m=>m.classList.remove("open"))}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeAll);
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)closeAll()}));
$("#btnAdmin").onclick=()=>open(admin?"#mAdd":"#mLogin");
$("#doLogin").onclick=async()=>{
  try{const j=await api("POST","/api/login",{u:$("#u").value.trim(),p:$("#p").value});token=j.token;admin=true;try{sessionStorage.setItem("mito_token",token)}catch(e){}
    $("#lerr").textContent="";$("#p").value="";closeAll();render();open("#mAdd");toast("Sesión iniciada")}
  catch(e){$("#lerr").textContent="Usuario o contraseña incorrectos"}
};
$("#doLogout").onclick=()=>{logout();closeAll();toast("Sesión cerrada")};
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(480,im.width),h=im.height*w/im.width,c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);res(c.toDataURL("image/jpeg",.65))};im.onerror=()=>res("");im.src=r.result};r.readAsDataURL(file)})}
$("#doAdd").onclick=async()=>{
  const n=$("#aName").value.trim(),d=$("#aDesc").value.trim(),p=Number($("#aPrice").value);
  if(!n||!d||!(p>0)){$("#aerr").textContent="Completa nombre, descripción y precio";return}
  const btn=$("#doAdd");btn.disabled=true;btn.textContent="Guardando...";
  try{
    const f=$("#aImg").files[0];const img=f?await shrink(f):"";
    const item=await api("POST","/api/dishes",{c:$("#aCat").value,n,d,p,e:$("#aEmoji").value||"🍽️",img});
    custom.push(item);$("#aerr").textContent="";["#aName","#aDesc","#aPrice","#aImg"].forEach(s=>$(s).value="");
    closeAll();render();toast("Platillo agregado ✔");
    setTimeout(()=>document.getElementById(item.c).scrollIntoView({behavior:"smooth"}),100);
  }catch(e){$("#aerr").textContent=e.message}
  btn.disabled=false;btn.textContent="Agregar";
};
$("#menu").addEventListener("click",async e=>{const id=e.target.dataset.del;if(id&&confirm("¿Eliminar este platillo?")){try{await api("DELETE","/api/dishes?id="+id);custom=custom.filter(x=>x.id!==id);render()}catch(err){toast(err.message)}}});
render();load();
</script>
</body>
</html>
